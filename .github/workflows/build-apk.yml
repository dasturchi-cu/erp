name: Build Mobile APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Universal and Split APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: erp-mobile-apks
          path: mobile/build/app/outputs/flutter-apk/*.apk

      - name: Release APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-v2.1.0
          name: ERP Mobile v2.1.0 APK
          body: |
            ## ERP Mobile Release APK (Android)
            Avtomatik yig'ilgan rasmiy release APK fayllari.
            
            - **app-release.apk:** Barcha Android qurilmalar uchun universal APK.
            - **app-arm64-v8a-release.apk:** Zamonaviy 64-bit Android telefonlar uchun (tavsiya etiladi).
            - **app-armeabi-v7a-release.apk:** 32-bit Android qurilmalar uchun.
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
