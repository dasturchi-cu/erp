name: Build Mobile APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Release tag/name come from pubspec.yaml's `version: <name>+<build>`
      # so every version bump gets its own GitHub release.
      - name: Read app version
        id: version
        run: |
          RAW=$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*//' | tr -d '[:space:]')
          NAME=${RAW%%+*}
          BUILD=${RAW#*+}
          [ "$BUILD" = "$RAW" ] && BUILD=""
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "App version: $NAME (build ${BUILD:-n/a})"

      # Writes android/key.properties + the keystore from repository secrets
      # (ANDROID_KEYSTORE_BASE64 = base64 of the .jks file). Without them the
      # Gradle build falls back to the debug key — such APKs cannot update an
      # installed release-signed app.
      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::Android signing secrets are not set - the release APK will be signed with the DEBUG key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build Universal and Split APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: erp-mobile-apks
          path: mobile/build/app/outputs/flutter-apk/*.apk

      - name: Release APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-v${{ steps.version.outputs.name }}
          name: ERP Mobile v${{ steps.version.outputs.name }} APK
          body: |
            ## ERP Mobile Release APK (Android)
            Avtomatik yig'ilgan rasmiy release APK fayllari.
            Versiya: ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.build }})
            ${{ steps.signing.outputs.signed != 'true' && '> **Diqqat:** bu APK debug kalit bilan imzolangan (signing secrets sozlanmagan) - o''rnatilgan release ilovani yangilay olmaydi.' || '' }}
            
            - **app-release.apk:** Barcha Android qurilmalar uchun universal APK.
            - **app-arm64-v8a-release.apk:** Zamonaviy 64-bit Android telefonlar uchun (tavsiya etiladi).
            - **app-armeabi-v7a-release.apk:** 32-bit Android qurilmalar uchun.
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/release.jks
