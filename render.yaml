services:
  - type: web
    name: erp-backend
    env: node
    region: singapore
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma db push && npx prisma db seed && node dist/src/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: THROTTLE_LIMIT
        value: "1000"
      - key: THROTTLE_TTL
        value: "900000"

databases:
  - name: erp-db
    databaseName: erp
    user: erp
    plan: free
